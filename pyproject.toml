[project]
name = "bots-place"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vlad", email = "tecnomega@mail.ru" }
]
requires-python = ">=3.14"
dependencies = [
    "aiosmtplib>=5.1.3",
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "authlib>=1.9.5",
    "dishka>=1.10.1",
    "email-validator>=2.3.0",
    "fastapi>=0.162.0",
    "greenlet>=3.5.6",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pytest>=9.2.0",
    "pytest-asyncio",
    "python-multipart>=0.0.33",
    "ruff>=0.17.3",
    "sqlalchemy>=2.1.6",
    "types-authlib>=1.8.0.20261106",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = true

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.mypy]
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
