name: bots-place

services:
  postgres:
    image: postgres:17-alpine
    container_name: bots-place-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-bots_place}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-bots_place}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: bots-place-app
    restart: unless-stopped
    env_file:
      - ./src/bots_place/config/.env
    environment:
      # внутри сети compose БД доступна по имени сервиса
      DB_HOST: postgres
      DB_PORT: "5432"
    ports:
      - "8086:8086"
    depends_on:
      postgres:
        condition: service_healthy

  adminer:
    image: adminer:latest
    container_name: bots-place-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
