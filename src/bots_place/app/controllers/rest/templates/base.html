<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %} — Bots Place</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #ec4899 100%);
        }

        .card {
            width: 100%;
            max-width: 400px;
            margin: 16px;
            padding: 40px 32px;
            border-radius: 20px;
            background: #ffffff;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        h1 {
            margin: 0;
            font-size: 26px;
            color: #111827;
            text-align: center;
        }

        .subtitle {
            margin: 8px 0 28px;
            font-size: 15px;
            color: #6b7280;
            text-align: center;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 500;
            color: #374151;
        }

        input[type="email"],
        input[type="text"] {
            width: 100%;
            padding: 12px 14px;
            margin-bottom: 16px;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="email"]:focus,
        input[type="text"]:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 12px 16px;
            margin-top: 16px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s, background 0.2s;
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .primary {
            color: #ffffff;
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
        }

        .primary:hover {
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 24px 0 8px;
            font-size: 13px;
            color: #9ca3af;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #e5e7eb;
        }

        .divider span {
            padding: 0 12px;
        }

        .google {
            color: #374151;
            background: #ffffff;
            border: 1px solid #d1d5db;
        }

        .google:hover {
            background: #f9fafb;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .switch {
            margin-top: 12px;
            color: #6366f1;
            background: transparent;
        }

        .switch:hover {
            background: rgba(99, 102, 241, 0.08);
        }
    </style>
</head>
<body>
    <main class="card">
        <noscript>
            <style>form[data-api] { display: none; }</style>
            <p class="subtitle" style="color: #dc2626;">Для работы формы включите JavaScript в браузере и обновите страницу.</p>
        </noscript>
        {% block content %}{% endblock %}

        {% block alternative %}
        <div class="divider"><span>или</span></div>

        <a class="btn google" href="{{ google_url }}">
            <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            </svg>
            {% block google_label %}{% endblock %}
        </a>
        {% endblock %}

        {% block switch %}{% endblock %}
    </main>
<script src="/static/auth.js" defer></script>
</body>
</html>
