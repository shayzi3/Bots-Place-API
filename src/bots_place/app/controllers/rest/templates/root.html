<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bots Place</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #ec4899 100%);
        }

        .header {
            display: flex;
            justify-content: flex-end;
            padding: 16px 24px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            color: #6366f1;
            background: #ffffff;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
        }

        .btn:active {
            transform: translateY(0);
        }

        .profile {
            position: relative;
        }

        .profile-popup {
            position: absolute;
            right: 0;
            top: calc(100% + 8px);
            width: 320px;
            padding: 16px;
            border-radius: 16px;
            background: #ffffff;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        .profile-popup[hidden] {
            display: none;
        }

        .user-menu {
            color: #111827;
        }

        .user-menu__header {
            display: flex;
            align-items: center;
            gap: 14px;
            padding-bottom: 16px;
            margin-bottom: 14px;
            border-bottom: 1px solid #ede9fe;
        }

        .user-menu__avatar {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
            background: linear-gradient(135deg, #6366f1, #ec4899);
            box-shadow: 0 6px 16px rgba(99, 102, 241, 0.35);
        }

        .user-menu__titles {
            min-width: 0;
        }

        .user-menu__name {
            margin: 0;
            font-size: 16px;
            font-weight: 700;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .user-menu__email {
            margin: 2px 0 0;
            font-size: 13px;
            color: #6b7280;
            word-break: break-all;
        }

        .user-menu__fields {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin: 0 0 12px;
        }

        .user-menu__field {
            padding: 10px 12px;
            border-radius: 12px;
            background: #f5f3ff;
        }

        .user-menu__field dt {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: #7c3aed;
        }

        .user-menu__field dd {
            margin: 4px 0 0;
            font-size: 14px;
            font-weight: 600;
            color: #111827;
        }

        .user-menu__action {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            margin-top: 8px;
            padding: 11px 14px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            color: #374151;
            background: #f9fafb;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }

        .user-menu__action:hover {
            color: #6366f1;
            background: #eef2ff;
        }

        .user-menu__action span {
            color: #9ca3af;
        }

    </style>
</head>
<body>
    <header class="header">
        {% if is_authenticated %}
        <div class="profile">
            <button type="button" class="btn" id="profile-button" aria-expanded="false" aria-controls="profile-menu">Профиль</button>
            <div class="profile-popup" id="profile-menu" hidden></div>
        </div>
        {% else %}
        <a class="btn" href="{{ login_url }}">Войти</a>
        {% endif %}
    </header>
    {% if is_authenticated %}
    <script>
        (function () {
            var button = document.getElementById("profile-button");
            var menu = document.getElementById("profile-menu");
            var loaded = false;

            function createElement(tag, className, text) {
                var node = document.createElement(tag);
                if (className) {
                    node.className = className;
                }
                if (text !== undefined) {
                    node.textContent = text;
                }
                return node;
            }

            function formatDate(value) {
                return new Date(value).toLocaleDateString("ru-RU", {
                    day: "numeric",
                    month: "long",
                    year: "numeric",
                });
            }

            function field(label, value) {
                var item = createElement("div", "user-menu__field");
                item.appendChild(createElement("dt", "", label));
                item.appendChild(createElement("dd", "", value));
                return item;
            }

            function actionButton(label) {
                var action = createElement("button", "user-menu__action", label);
                action.type = "button";
                action.appendChild(createElement("span", "", "→"));
                return action;
            }

            function renderProfile(user) {
                var wrap = createElement("div", "user-menu");

                var header = createElement("div", "user-menu__header");
                header.appendChild(
                    createElement("div", "user-menu__avatar", user.username.charAt(0).toUpperCase())
                );
                var titles = createElement("div", "user-menu__titles");
                titles.appendChild(createElement("p", "user-menu__name", user.username));
                titles.appendChild(createElement("p", "user-menu__email", user.email));
                header.appendChild(titles);
                wrap.appendChild(header);

                var fields = createElement("dl", "user-menu__fields");
                fields.appendChild(field("ID", "#" + user.id));
                fields.appendChild(field("Регистрация", formatDate(user.created_at)));
                wrap.appendChild(fields);

                wrap.appendChild(actionButton("Изменить имя"));
                wrap.appendChild(actionButton("Изменить почту"));
                return wrap;
            }

            button.addEventListener("click", async function () {
                if (!menu.hidden) {
                    menu.hidden = true;
                    button.setAttribute("aria-expanded", "false");
                    return;
                }
                if (!loaded) {
                    var response = await fetch("{{ profile_url }}", {
                        credentials: "same-origin",
                        headers: { Accept: "application/json" },
                    });
                    if (response.status === 401) {
                        window.location.href = "{{ login_url }}";
                        return;
                    }
                    if (!response.ok) {
                        return;
                    }
                    var body = await response.json();
                    menu.replaceChildren(renderProfile(body.data));
                    loaded = true;
                }
                menu.hidden = false;
                button.setAttribute("aria-expanded", "true");
            });
        })();
    </script>
    {% endif %}
</body>
</html>
