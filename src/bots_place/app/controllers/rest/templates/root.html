<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bots Place</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #ec4899 100%);
        }

        .header {
            display: flex;
            justify-content: flex-end;
            padding: 16px 24px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            color: #6366f1;
            background: #ffffff;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
        }

        .btn:active {
            transform: translateY(0);
        }

        .profile {
            position: relative;
        }

        .profile-popup {
            position: absolute;
            right: 0;
            top: calc(100% + 8px);
            width: 320px;
            padding: 16px;
            border-radius: 16px;
            background: #ffffff;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        .profile-popup[hidden] {
            display: none;
        }

        .user-menu {
            color: #111827;
        }

        .user-menu__header {
            display: flex;
            align-items: center;
            gap: 14px;
            padding-bottom: 16px;
            margin-bottom: 14px;
            border-bottom: 1px solid #ede9fe;
        }

        .user-menu__avatar {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
            background: linear-gradient(135deg, #6366f1, #ec4899);
            box-shadow: 0 6px 16px rgba(99, 102, 241, 0.35);
        }

        .user-menu__titles {
            min-width: 0;
        }

        .user-menu__name {
            margin: 0;
            font-size: 16px;
            font-weight: 700;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .user-menu__email {
            margin: 2px 0 0;
            font-size: 13px;
            color: #6b7280;
            word-break: break-all;
        }

        .user-menu__fields {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin: 0 0 12px;
        }

        .user-menu__field {
            padding: 10px 12px;
            border-radius: 12px;
            background: #f5f3ff;
        }

        .user-menu__field dt {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: #7c3aed;
        }

        .user-menu__field dd {
            margin: 4px 0 0;
            font-size: 14px;
            font-weight: 600;
            color: #111827;
        }

        .user-menu__action {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            margin-top: 8px;
            padding: 11px 14px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            color: #374151;
            background: #f9fafb;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }

        .user-menu__action:hover {
            color: #6366f1;
            background: #eef2ff;
        }

        .user-menu__action span {
            color: #9ca3af;
        }

        .modal {
            width: min(380px, calc(100vw - 32px));
            padding: 24px;
            border: none;
            border-radius: 16px;
            color: #111827;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        .modal::backdrop {
            background: rgba(17, 24, 39, 0.45);
        }

        .modal__title {
            margin: 0 0 16px;
            font-size: 18px;
            font-weight: 700;
        }

        .modal__label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 600;
            color: #374151;
        }

        .modal__input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd6fe;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
        }

        .modal__input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        .modal__error {
            margin: 10px 0 0;
            font-size: 13px;
            color: #dc2626;
        }

        .modal__error[hidden] {
            display: none;
        }

        .modal__info {
            margin: 10px 0 0;
            font-size: 13px;
            color: #047857;
        }

        .modal__info[hidden] {
            display: none;
        }

        .modal__actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 20px;
        }

        .modal__cancel {
            color: #374151;
            background: #f3f4f6;
            box-shadow: none;
        }

        .modal__submit:disabled {
            opacity: 0.6;
            cursor: default;
        }

    </style>
</head>
<body>
    <header class="header">
        {% if is_authenticated %}
        <div class="profile">
            <button type="button" class="btn" id="profile-button" aria-expanded="false" aria-controls="profile-menu">Профиль</button>
            <div class="profile-popup" id="profile-menu" hidden></div>
        </div>
        {% else %}
        <a class="btn" href="{{ login_url }}">Войти</a>
        {% endif %}
    </header>
    {% if is_authenticated %}
    <dialog class="modal" id="username-dialog">
        <form id="username-form">
            <h2 class="modal__title">Изменить имя</h2>
            <label class="modal__label" for="username-input">Новое имя</label>
            <input class="modal__input" id="username-input" name="username" type="text" maxlength="100" autocomplete="name" required>
            <p class="modal__error" id="username-error" hidden></p>
            <div class="modal__actions">
                <button type="button" class="btn modal__cancel" id="username-cancel">Отмена</button>
                <button type="submit" class="btn modal__submit" id="username-submit">Сохранить</button>
            </div>
        </form>
    </dialog>
    <dialog class="modal" id="email-warning-dialog">
        <h2 class="modal__title">Вы точно хотите изменить почту?</h2>
        <div class="modal__actions">
            <button type="button" class="btn modal__cancel" id="email-warning-no">Нет</button>
            <button type="button" class="btn modal__submit" id="email-warning-yes">Да</button>
        </div>
    </dialog>
    <dialog class="modal" id="email-dialog">
        <form id="email-form">
            <h2 class="modal__title">Новая почта</h2>
            <label class="modal__label" for="email-input">Email</label>
            <input class="modal__input" id="email-input" name="email" type="email" maxlength="255" autocomplete="email" required>
            <p class="modal__error" id="email-error" hidden></p>
            <p class="modal__info" id="email-info" hidden></p>
            <div class="modal__actions">
                <button type="button" class="btn modal__cancel" id="email-cancel">Отмена</button>
                <button type="submit" class="btn modal__submit" id="email-submit">Отправить</button>
            </div>
        </form>
    </dialog>
    <script>
        (function () {
            var button = document.getElementById("profile-button");
            var menu = document.getElementById("profile-menu");
            var loaded = false;
            var nameNode = null;
            var avatarNode = null;

            function createElement(tag, className, text) {
                var node = document.createElement(tag);
                if (className) {
                    node.className = className;
                }
                if (text !== undefined) {
                    node.textContent = text;
                }
                return node;
            }

            function formatDate(value) {
                return new Date(value).toLocaleDateString("ru-RU", {
                    day: "numeric",
                    month: "long",
                    year: "numeric",
                });
            }

            function field(label, value) {
                var item = createElement("div", "user-menu__field");
                item.appendChild(createElement("dt", "", label));
                item.appendChild(createElement("dd", "", value));
                return item;
            }

            function actionButton(label) {
                var action = createElement("button", "user-menu__action", label);
                action.type = "button";
                action.appendChild(createElement("span", "", "→"));
                return action;
            }

            function renderProfile(user) {
                var wrap = createElement("div", "user-menu");

                var header = createElement("div", "user-menu__header");
                avatarNode = createElement("div", "user-menu__avatar");
                header.appendChild(avatarNode);
                var titles = createElement("div", "user-menu__titles");
                nameNode = createElement("p", "user-menu__name");
                titles.appendChild(nameNode);
                titles.appendChild(createElement("p", "user-menu__email", user.email));
                setUsername(user.username);
                header.appendChild(titles);
                wrap.appendChild(header);

                var fields = createElement("dl", "user-menu__fields");
                fields.appendChild(field("ID", "#" + user.id));
                fields.appendChild(field("Регистрация", formatDate(user.created_at)));
                wrap.appendChild(fields);

                var changeName = actionButton("Изменить имя");
                changeName.addEventListener("click", openUsernameDialog);
                wrap.appendChild(changeName);
                var changeEmail = actionButton("Изменить почту");
                changeEmail.addEventListener("click", openEmailWarning);
                wrap.appendChild(changeEmail);
                var logoutButton = actionButton("Выйти из профиля");
                logoutButton.addEventListener("click", logout);
                wrap.appendChild(logoutButton);
                return wrap;
            }

            function setUsername(username) {
                nameNode.textContent = username;
                avatarNode.textContent = username.charAt(0).toUpperCase();
            }

            var dialog = document.getElementById("username-dialog");
            var form = document.getElementById("username-form");
            var input = document.getElementById("username-input");
            var errorText = document.getElementById("username-error");
            var submit = document.getElementById("username-submit");
            var cancel = document.getElementById("username-cancel");

            function showError(message) {
                errorText.textContent = message;
                errorText.hidden = false;
            }

            function openUsernameDialog() {
                input.value = nameNode.textContent;
                errorText.hidden = true;
                errorText.textContent = "";
                dialog.showModal();
                input.select();
            }

            cancel.addEventListener("click", function () {
                dialog.close();
            });

            form.addEventListener("submit", async function (event) {
                event.preventDefault();
                var username = input.value.trim();
                if (!username) {
                    showError("Введите имя.");
                    return;
                }
                submit.disabled = true;
                try {
                    var response = await fetch("{{ profile_url }}", {
                        method: "PATCH",
                        credentials: "same-origin",
                        headers: { Accept: "application/json" },
                        body: new URLSearchParams({ username: username }),
                    });
                    if (response.status === 401) {
                        window.location.href = "{{ login_url }}";
                        return;
                    }
                    if (response.status === 422) {
                        showError("Имя должно быть от 1 до 100 символов.");
                        return;
                    }
                    if (!response.ok) {
                        showError("Не удалось сохранить имя. Попробуйте ещё раз.");
                        return;
                    }
                    var body = await response.json();
                    setUsername(body.data.username);
                    dialog.close();
                } catch (err) {
                    showError("Нет связи с сервером. Попробуйте ещё раз.");
                } finally {
                    submit.disabled = false;
                }
            });

            var emailWarningDialog = document.getElementById("email-warning-dialog");
            var emailDialog = document.getElementById("email-dialog");
            var emailForm = document.getElementById("email-form");
            var emailInput = document.getElementById("email-input");
            var emailError = document.getElementById("email-error");
            var emailInfo = document.getElementById("email-info");
            var emailSubmit = document.getElementById("email-submit");

            function showEmailError(message) {
                emailError.textContent = message;
                emailError.hidden = false;
            }

            function openEmailWarning() {
                emailWarningDialog.showModal();
            }

            document.getElementById("email-warning-no").addEventListener("click", function () {
                emailWarningDialog.close();
            });

            document.getElementById("email-warning-yes").addEventListener("click", function () {
                emailWarningDialog.close();
                emailInput.value = "";
                emailError.hidden = true;
                emailInfo.hidden = true;
                emailSubmit.hidden = false;
                emailDialog.showModal();
                emailInput.focus();
            });

            document.getElementById("email-cancel").addEventListener("click", function () {
                emailDialog.close();
            });

            emailForm.addEventListener("submit", async function (event) {
                event.preventDefault();
                var email = emailInput.value.trim();
                if (!email) {
                    showEmailError("Введите email.");
                    return;
                }
                emailSubmit.disabled = true;
                try {
                    var response = await fetch("{{ change_email_url }}", {
                        method: "POST",
                        credentials: "same-origin",
                        headers: { Accept: "application/json" },
                        body: new URLSearchParams({ email: email }),
                    });
                    if (response.status === 401) {
                        window.location.href = "{{ login_url }}";
                        return;
                    }
                    var body = await response.json();
                    if (!response.ok) {
                        showEmailError(body.msg || "Не удалось отправить ссылку. Попробуйте ещё раз.");
                        return;
                    }
                    emailError.hidden = true;
                    emailInfo.textContent = body.msg;
                    emailInfo.hidden = false;
                    emailSubmit.hidden = true;
                } catch (err) {
                    showEmailError("Нет связи с сервером. Попробуйте ещё раз.");
                } finally {
                    emailSubmit.disabled = false;
                }
            });

            function logout() {
                fetch("{{ logout_url }}", {
                    method: "POST",
                    credentials: "same-origin",
                    headers: { Accept: "application/json" },
                }).finally(function () {
                    window.location.reload();
                });
            }

            button.addEventListener("click", async function () {
                if (!menu.hidden) {
                    menu.hidden = true;
                    button.setAttribute("aria-expanded", "false");
                    return;
                }
                if (!loaded) {
                    var response = await fetch("{{ profile_url }}", {
                        credentials: "same-origin",
                        headers: { Accept: "application/json" },
                    });
                    if (response.status === 401) {
                        window.location.href = "{{ login_url }}";
                        return;
                    }
                    if (!response.ok) {
                        return;
                    }
                    var body = await response.json();
                    menu.replaceChildren(renderProfile(body.data));
                    loaded = true;
                }
                menu.hidden = false;
                button.setAttribute("aria-expanded", "true");
            });
        })();
    </script>
    {% endif %}
</body>
</html>
